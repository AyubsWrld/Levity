# Tier 1 production deployment topology.
#
# This file is DEPLOYMENT CONFIGURATION ONLY. The development and integration-test workflow launches
# the three executables directly inside the SDK development container and never uses Docker Compose
# (docs/architecture/implementation-decisions.md section 1).
#
# Topology: three independent containers sharing ONE named Docker volume backed by Linux tmpfs and
# mounted at /tmp/edge-ipc, so all three see the same filesystem namespace for the ZeroMQ Unix-domain
# socket files. Per-service `tmpfs:` mounts are deliberately NOT used - they would give each container
# a private, unshared filesystem.
#
# The Docker socket is never mounted. Normal operation requires no WAN or cloud connectivity.
#
# Network segmentation: the three services exchange ALL inter-service data over the shared
# /tmp/edge-ipc Unix-domain sockets, never over IP. They are therefore deliberately placed on
# disjoint network namespaces so that a compromise of one container cannot reach another's
# listeners. Tier 1 has no authentication on POST /api/v1/slew (which moves physical hardware),
# so IP-level isolation is the compensating control:
#   - dummy_monolith    : `network_mode: none` - needs no IP connectivity whatsoever.
#   - api_gateway       : `frontend` network only - reachable solely via the host-loopback
#                         published port below.
#   - gimbal_controller : `hardware` network only - needs egress to the STANAG UDP endpoint,
#                         and cannot reach the gateway's REST control plane.
# Do not place these services on a shared network; doing so would let a compromised sibling
# issue unauthenticated slew commands to http://api_gateway:8080.

services:
  dummy_monolith:
    build:
      context: .
      dockerfile: deploy/Dockerfile.runtime
      args:
        EDGE_SERVICE: dummy_monolith
    image: edge/dummy-monolith:0.1.0
    restart: unless-stopped
    # Publishes telemetry exclusively over the shared Unix-domain socket; no IP connectivity needed.
    network_mode: none
    environment:
      EDGE_TELEMETRY_ENDPOINT: ipc:///tmp/edge-ipc/telemetry.ipc
      EDGE_TELEMETRY_INTERVAL_MS: "200"
    volumes:
      - edge-ipc:/tmp/edge-ipc
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    deploy:
      resources:
        limits:
          memory: 256M

  api_gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.runtime
      args:
        EDGE_SERVICE: api_gateway
    image: edge/api-gateway:0.1.0
    restart: unless-stopped
    networks:
      - frontend
    environment:
      EDGE_TELEMETRY_ENDPOINT: ipc:///tmp/edge-ipc/telemetry.ipc
      EDGE_GIMBAL_COMMAND_ENDPOINT: ipc:///tmp/edge-ipc/gimbal-cmd.ipc
      # Binding to 0.0.0.0 is required to reach the listener from outside the container namespace.
      # Tier 1 has no authentication or authorisation (docs/architecture/tier1-contracts.md section 8).
      # Two controls contain that: the published port below is restricted to the host loopback
      # interface, and the `frontend` network is not shared with any sibling service, so neither
      # dummy_monolith nor gimbal_controller can reach this control plane over IP.
      # Exposing this control plane on a routable interface requires an explicit security decision.
      EDGE_HTTP_HOST: 0.0.0.0
      EDGE_HTTP_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - edge-ipc:/tmp/edge-ipc
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    deploy:
      resources:
        limits:
          memory: 256M

  gimbal_controller:
    build:
      context: .
      dockerfile: deploy/Dockerfile.runtime
      args:
        EDGE_SERVICE: gimbal_controller
    image: edge/gimbal-controller:0.1.0
    restart: unless-stopped
    # Isolated from the gateway's `frontend` network: this service only needs egress to the
    # sensor/gimbal hardware, never inbound or outbound access to the REST control plane.
    networks:
      - hardware
    environment:
      EDGE_GIMBAL_COMMAND_ENDPOINT: ipc:///tmp/edge-ipc/gimbal-cmd.ipc
      # Address of the sensor/gimbal hardware that receives the dummy STANAG 4586 #200/#201 datagrams.
      EDGE_STANAG_UDP_HOST: 127.0.0.1
      EDGE_STANAG_UDP_PORT: "14550"
    volumes:
      - edge-ipc:/tmp/edge-ipc
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  # Deliberately disjoint namespaces. All inter-service data flows over the shared UDS volume,
  # so no network is shared between any two services; a compromised sibling cannot reach the
  # gateway's unauthenticated REST control plane over IP.
  #
  # `internal: true` is intentionally NOT set on `frontend`: it would deny the bridge a default
  # route, and the interaction between that and host port publishing has not been validated on
  # target hardware (the development container has no Docker daemon). Adding it is a reasonable
  # further hardening step once it can be tested end to end.
  frontend:
    driver: bridge
  hardware:
    driver: bridge

volumes:
  # One shared named volume backed by Linux tmpfs, mounted at /tmp/edge-ipc by all three containers.
  # tmpfs also gives power-loss cleanup of stale socket files for free; it is not a substitute for
  # deterministic shutdown during normal operation.
  edge-ipc:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16m,mode=0770,uid=10001,gid=10001"
