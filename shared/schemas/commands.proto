/**
 * @file commands.proto
 * @brief Protocol Buffer schema defining the Tier-1 shared gimbal-command domain contract.
 *
 * @details Generated message types are deliberately used as the shared internal domain contract.
 */

syntax = "proto3";

package edge.commands.v1;

import "telemetry.proto";

/**
 * @brief Resolved slew command sent by the API Gateway to the Gimbal Controller.
 *
 * @details Tier 1 deliberately does not make the gimbal controller subscribe to telemetry. The API
 * Gateway therefore resolves the selected UID against its own latest cue cache and embeds the full
 * target coordinates in the command. Unknown UIDs are rejected by the gateway before command IPC.
 */
message SlewCommand {
    /** Operator-selected stable target UID. */
    string target_uid = 1;
    /** Resolved domain target containing the coordinates the gimbal adapter must command. */
    edge.telemetry.v1.Target target = 2;
}

/** @brief Domain acknowledgement status returned by the Gimbal Controller. */
enum SlewStatus {
    /** No explicit result was assigned; receivers should treat this as invalid/unspecified. */
    SLEW_STATUS_UNSPECIFIED = 0;
    /** Command passed core validation and the selected output adapter accepted the send. */
    SLEW_STATUS_ACCEPTED = 1;
    /** Command content was structurally/semantically invalid for execution. */
    SLEW_STATUS_REJECTED_INVALID = 2;
    /** Reserved domain rejection for a target that cannot be resolved by the receiver. */
    SLEW_STATUS_REJECTED_UNKNOWN_TARGET = 3;
    /** The selected physical/output adapter failed while executing the command. */
    SLEW_STATUS_HARDWARE_ERROR = 4;
}

/**
 * @brief Synchronous application acknowledgement for one SlewCommand request.
 *
 * @details Tier 1 deliberately contains no request ID. A received reply acknowledges the request
 * cycle, but does not provide an exactly-once physical-execution guarantee. If the requester times
 * out after sending, the outcome is ambiguous and the command must not be automatically retried
 * unless future contract work adds explicit idempotency/deduplication semantics.
 */
message SlewCommandReply {
    /** Accepted/rejected/hardware result classification. */
    SlewStatus status = 1;
    /** Human-readable result detail for diagnostics/client mapping; producers should keep it concise. */
    string detail = 2;
    /** Target UID associated with the processed request. */
    string target_uid = 3;
}
